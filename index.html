<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<title>3D 第一人称像素射击 · 手机适配版</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; overflow: hidden; background: #0e0e16;
    font-family: monospace; touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none; -webkit-user-drag: none;
    width: 100%; height: 100%; position: fixed; }
  canvas { display: block; touch-action: none; }

  #hud { position: fixed; left: 22px; bottom: 22px; color: #fff; font-family: monospace;
    pointer-events: none; z-index: 10; }
  #hpbar-bg { width: 260px; height: 24px; background: #000a; border: 2px solid #fff6; position: relative; }
  #hpbar { width: 100%; height: 100%; background: #4ddc64; transition: width .18s, background .18s; }
  #hptext { margin-top: 6px; font-size: 16px; text-shadow: 2px 2px 0 #000; }

  #ammo { position: fixed; right: 26px; bottom: 22px; color: #fff; font-family: monospace;
    pointer-events: none; text-align: right; z-index: 10; }
  #mag { font-size: 44px; font-weight: bold; line-height: 1; text-shadow: 2px 2px 0 #000; }
  #mag.low { color: #ff5a5a; }
  #reserve { font-size: 20px; color: #cfcfcf; text-shadow: 2px 2px 0 #000; }
  #reload-hint { font-size: 14px; color: #ffd35a; margin-top: 2px; height: 18px; }

  #grenade { position: fixed; right: 26px; bottom: 110px; color: #7dfa8a; font-family: monospace;
    font-size: 18px; pointer-events: none; text-shadow: 2px 2px 0 #000; z-index: 10; }

  #kills { position: fixed; right: 26px; top: 20px; color: #fff; font-family: monospace;
    font-size: 16px; text-shadow: 2px 2px 0 #000; pointer-events: none; z-index: 10; }
  #timer { position: fixed; left: 26px; top: 20px; color: #9ab; font-family: monospace;
    font-size: 14px; pointer-events: none; text-shadow: 2px 2px 0 #000; z-index: 10; }

  #hurt { position: fixed; inset: 0; background: #f00; opacity: 0; pointer-events: none;
    transition: opacity .35s; z-index: 5; }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 5; }

  #crosshair { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
    pointer-events: none; z-index: 8; }
  #crosshair::before, #crosshair::after { content:''; position:absolute; background:#fff8; }
  #crosshair::before { width: 20px; height: 2px; left: -10px; top: -1px; }
  #crosshair::after { width: 2px; height: 20px; left: -1px; top: -10px; }

  #gameover { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    flex-direction: column; color: #ff4444; font-family: monospace; background: #000b; z-index: 100; }
  #gameover h1 { font-size: 46px; margin: 0 0 12px; text-shadow: 3px 3px 0 #300; }
  #gameover p { color: #fff; font-size: 18px; }

  #info { position: fixed; left: 26px; top: 46px; color: #667; font-family: monospace;
    font-size: 12px; pointer-events: none; line-height: 1.6; z-index: 10; }

  /* ============ 手机控制 ============ */
  #mobile-controls {
    display: none;
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 50;
  }
  body.touch-device #mobile-controls { display: block; }
  #mobile-controls > * { pointer-events: auto; }

  #joystick-base {
    position: fixed;
    left: 24px; bottom: 30px;
    width: 150px; height: 150px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(120,180,255,0.12) 0%, rgba(120,180,255,0.04) 70%, transparent 100%);
    border: 2px solid rgba(150,200,255,0.4);
    box-shadow: 0 0 24px rgba(100,160,255,0.22), inset 0 0 20px rgba(100,160,255,0.08);
    touch-action: none;
  }
  #joystick-knob {
    position: absolute; left: 50%; top: 50%;
    width: 66px; height: 66px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(180,220,255,0.85), rgba(90,140,220,0.65));
    border: 2px solid rgba(220,240,255,0.85);
    transform: translate(-50%,-50%);
    pointer-events: none;
    box-shadow: 0 4px 16px rgba(0,0,0,0.5), 0 0 22px rgba(120,180,255,0.55);
  }

  .ctrl-btn {
    position: fixed;
    width: 78px; height: 78px; border-radius: 50%;
    background: rgba(40,45,70,0.7);
    border: 2px solid rgba(180,200,255,0.55);
    color: #fff; font-family: monospace; font-size: 14px; font-weight: bold;
    display: flex; align-items: center; justify-content: center; text-align: center;
    touch-action: none; text-shadow: 1px 1px 3px #000; line-height: 1.15;
    padding: 4px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.45), inset 0 0 12px rgba(120,160,255,0.12);
    transition: transform .08s, background .08s;
  }
  .ctrl-btn.pressed { transform: scale(0.92); background: rgba(90,120,200,0.75); }

  #btn-shoot {
    right: 26px; bottom: 30px;
    width: 105px; height: 105px; font-size: 18px;
    background: radial-gradient(circle at 35% 30%, rgba(255,120,120,0.5), rgba(180,30,30,0.7));
    border-color: rgba(255,140,140,0.8);
    box-shadow: 0 4px 16px rgba(0,0,0,0.5), 0 0 26px rgba(255,80,80,0.4), inset 0 0 16px rgba(255,120,120,0.25);
  }
  #btn-shoot.pressed { background: radial-gradient(circle at 35% 30%, rgba(255,160,160,0.8), rgba(220,40,40,0.9)); }

  #btn-jump {
    right: 32px; bottom: 156px;
    background: radial-gradient(circle at 35% 30%, rgba(150,220,255,0.35), rgba(30,90,160,0.7));
    border-color: rgba(160,220,255,0.7);
  }
  #btn-reload {
    right: 152px; bottom: 32px;
    background: radial-gradient(circle at 35% 30%, rgba(255,220,120,0.35), rgba(150,110,20,0.7));
    border-color: rgba(255,220,120,0.75);
  }
  #btn-grenade {
    right: 156px; bottom: 156px;
    background: radial-gradient(circle at 35% 30%, rgba(150,255,170,0.35), rgba(30,130,60,0.7));
    border-color: rgba(150,255,170,0.7);
  }

  body.touch-device #info { display: none; }
  body.touch-device #hud { left: 16px; top: 16px; bottom: auto; }
  body.touch-device #hpbar-bg { width: 170px; height: 16px; }
  body.touch-device #hptext { font-size: 13px; margin-top: 4px; }
  body.touch-device #kills { left: 16px; top: 58px; right: auto; font-size: 13px; }
  body.touch-device #timer { left: 16px; top: 82px; font-size: 11px; }
  body.touch-device #ammo { right: 16px; top: 16px; bottom: auto; }
  body.touch-device #mag { font-size: 30px; }
  body.touch-device #reserve { font-size: 14px; }
  body.touch-device #reload-hint { font-size: 12px; height: 16px; }
  body.touch-device #grenade { right: 16px; top: 88px; bottom: auto; font-size: 14px; }
  body.touch-device #crosshair::before { width: 26px; height: 2px; left: -13px; top: -1px; }
  body.touch-device #crosshair::after { width: 2px; height: 26px; left: -1px; top: -13px; }

  body.touch-device #joystick-base {
    left: max(18px, env(safe-area-inset-left));
    bottom: max(24px, env(safe-area-inset-bottom));
  }
  body.touch-device #btn-shoot {
    right: max(20px, env(safe-area-inset-right));
    bottom: max(24px, env(safe-area-inset-bottom));
  }
  body.touch-device #btn-jump {
    right: max(24px, env(safe-area-inset-right));
    bottom: calc(max(24px, env(safe-area-inset-bottom)) + 122px);
  }
  body.touch-device #btn-reload {
    right: calc(max(20px, env(safe-area-inset-right)) + 122px);
    bottom: max(24px, env(safe-area-inset-bottom));
  }
  body.touch-device #btn-grenade {
    right: calc(max(20px, env(safe-area-inset-right)) + 126px);
    bottom: calc(max(24px, env(safe-area-inset-bottom)) + 122px);
  }

  @media (max-width: 400px) {
    body.touch-device #joystick-base { width: 130px; height: 130px; }
    body.touch-device #joystick-knob { width: 58px; height: 58px; }
    body.touch-device #btn-shoot { width: 92px; height: 92px; font-size: 16px; }
    body.touch-device .ctrl-btn { width: 68px; height: 68px; font-size: 12px; }
    body.touch-device #btn-jump {
      bottom: calc(max(24px, env(safe-area-inset-bottom)) + 108px);
    }
    body.touch-device #btn-reload {
      right: calc(max(20px, env(safe-area-inset-right)) + 108px);
    }
    body.touch-device #btn-grenade {
      right: calc(max(20px, env(safe-area-inset-right)) + 112px);
      bottom: calc(max(24px, env(safe-area-inset-bottom)) + 108px);
    }
  }

  @media (orientation: landscape) and (max-height: 520px) {
    body.touch-device #joystick-base {
      width: 118px; height: 118px;
      left: max(16px, env(safe-area-inset-left));
      bottom: max(16px, env(safe-area-inset-bottom));
    }
    body.touch-device #joystick-knob { width: 52px; height: 52px; }
    body.touch-device #btn-shoot {
      width: 84px; height: 84px; font-size: 15px;
      right: max(16px, env(safe-area-inset-right));
      bottom: max(16px, env(safe-area-inset-bottom));
    }
    body.touch-device .ctrl-btn { width: 62px; height: 62px; font-size: 11px; }
    body.touch-device #btn-jump {
      right: max(18px, env(safe-area-inset-right));
      bottom: calc(max(16px, env(safe-area-inset-bottom)) + 96px);
    }
    body.touch-device #btn-reload {
      right: calc(max(16px, env(safe-area-inset-right)) + 100px);
      bottom: max(16px, env(safe-area-inset-bottom));
    }
    body.touch-device #btn-grenade {
      right: calc(max(16px, env(safe-area-inset-right)) + 104px);
      bottom: calc(max(16px, env(safe-area-inset-bottom)) + 96px);
    }
  }
</style>

<script>
(function () {
  function detectTouch() {
    if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) return true;
    if (window.matchMedia && window.matchMedia('(any-pointer: coarse)').matches) return true;
    if ('ontouchstart' in window) return true;
    if (navigator.maxTouchPoints > 0) return true;
    if (navigator.msMaxTouchPoints > 0) return true;
    if (location.search.indexOf('mobile=1') !== -1) return true;
    return false;
  }
  const isTouch = detectTouch();
  window.__IS_TOUCH__ = isTouch;

  function applyTouchClass() {
    if (!isTouch) return;
    document.documentElement.classList.add('touch-device');
    if (document.body) {
      document.body.classList.add('touch-device');
      const mc = document.getElementById('mobile-controls');
      if (mc) mc.style.display = 'block';
    } else {
      document.addEventListener('DOMContentLoaded', applyTouchClass, { once: true });
    }
  }
  applyTouchClass();
  window.addEventListener('load', applyTouchClass);
})();
</script>

<script type="module">
import * as THREE from 'three';

const isTouch = window.__IS_TOUCH__ === true;
if (isTouch) {
  document.documentElement.classList.add('touch-device');
  document.body.classList.add('touch-device');
  const mc = document.getElementById('mobile-controls');
  if (mc) mc.style.display = 'block';
}

/* =========================================================
   1. 基础场景
   ========================================================= */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e0e16);
scene.fog = new THREE.Fog(0x0e0e16, 30, 95);

const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.05, 500);

const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1));
renderer.shadowMap.enabled = false;
document.body.appendChild(renderer.domElement);

function pixelTexture(color, size = 16, noise = 0.14) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  ctx.fillStyle = color;
  ctx.fillRect(0, 0, size, size);
  for (let i = 0; i < size * size * 0.35; i++) {
    const x = (Math.random() * size) | 0;
    const y = (Math.random() * size) | 0;
    ctx.fillStyle = `rgba(0,0,0,${Math.random() * noise})`;
    ctx.fillRect(x, y, 1, 1);
  }
  const t = new THREE.CanvasTexture(c);
  t.magFilter = THREE.NearestFilter;
  t.minFilter = THREE.NearestFilter;
  return t;
}

scene.add(new THREE.AmbientLight(0xffffff, 0.8));
const sun = new THREE.DirectionalLight(0xffffff, 0.85);
sun.position.set(30, 70, 25);
scene.add(sun);

/* =========================================================
   2. 世界
   ========================================================= */
const solids = [];
function addSolid(mesh) {
  mesh.updateMatrixWorld(true);
  solids.push(new THREE.Box3().setFromObject(mesh));
  scene.add(mesh);
  return mesh;
}

const groundTex = pixelTexture('#2c3a2f', 32);
groundTex.wrapS = groundTex.wrapT = THREE.RepeatWrapping;
groundTex.repeat.set(70, 70);
const ground = new THREE.Mesh(
  new THREE.BoxGeometry(130, 1, 130),
  new THREE.MeshLambertMaterial({ map: groundTex })
);
ground.position.y = -0.5;
scene.add(ground);

const wallMat = new THREE.MeshLambertMaterial({ map: pixelTexture('#3b3b52') });
const wallGeo = new THREE.BoxGeometry(1, 1, 1);
[
  { p: [0, 6, 65], s: [132, 12, 2] },
  { p: [0, 6, -65], s: [132, 12, 2] },
  { p: [65, 6, 0], s: [2, 12, 132] },
  { p: [-65, 6, 0], s: [2, 12, 132] },
].forEach(w => {
  const m = new THREE.Mesh(wallGeo, wallMat);
  m.position.set(...w.p);
  m.scale.set(...w.s);
  addSolid(m);
});

const blockMats = [
  new THREE.MeshLambertMaterial({ map: pixelTexture('#47475f') }),
  new THREE.MeshLambertMaterial({ map: pixelTexture('#5b4a38') }),
  new THREE.MeshLambertMaterial({ map: pixelTexture('#3f5a4a') }),
];
for (let i = 0; i < 38; i++) {
  const x = (Math.random() - 0.5) * 108;
  const z = (Math.random() - 0.5) * 108;
  if (Math.hypot(x, z) < 8) continue;
  const h = 1.2 + Math.random() * 4.5;
  const m = new THREE.Mesh(wallGeo, blockMats[i % 3]);
  m.position.set(x, h / 2, z);
  m.scale.set(1.6, h, 1.6);
  addSolid(m);
}

/* =========================================================
   3. 玩家
   ========================================================= */
const player = {
  pos: new THREE.Vector3(0, 1.7, 0),
  vel: new THREE.Vector3(),
  yaw: 0,
  pitch: 0,
  onGround: true,
  hp: 100,
  radius: 0.42,
  height: 1.7,
};

/* =========================================================
   4. 枪械模型
   ========================================================= */
const gunGroup = new THREE.Group();
const matMetal = new THREE.MeshLambertMaterial({ map: pixelTexture('#54546f') });
const matDark  = new THREE.MeshLambertMaterial({ map: pixelTexture('#26262f') });
const matGrip  = new THREE.MeshLambertMaterial({ map: pixelTexture('#3a2f26') });
const matAcc   = new THREE.MeshLambertMaterial({ map: pixelTexture('#8a6a3a') });

const body = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.16, 0.62), matMetal);
body.position.set(0, 0, -0.12); gunGroup.add(body);
const barrel = new THREE.Mesh(new THREE.BoxGeometry(0.075, 0.075, 0.42), matDark);
barrel.position.set(0, 0.025, -0.6); gunGroup.add(barrel);
const muzzle = new THREE.Mesh(new THREE.BoxGeometry(0.11, 0.11, 0.09), matDark);
muzzle.position.set(0, 0.025, -0.83); gunGroup.add(muzzle);
const grip = new THREE.Mesh(new THREE.BoxGeometry(0.11, 0.24, 0.13), matGrip);
grip.position.set(0, -0.18, 0.06); grip.rotation.x = 0.18; gunGroup.add(grip);
const magMesh = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.28, 0.11), matAcc);
magMesh.position.set(0, -0.2, -0.16); magMesh.rotation.x = -0.08; gunGroup.add(magMesh);
const sightRear = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.05, 0.05), matDark);
sightRear.position.set(0, 0.1, 0.08); gunGroup.add(sightRear);
const sightFront = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.06, 0.03), matDark);
sightFront.position.set(0, 0.1, -0.7); gunGroup.add(sightFront);
const stock = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.13, 0.28), matGrip);
stock.position.set(0, -0.02, 0.3); gunGroup.add(stock);

const muzzleFlash = new THREE.Mesh(
  new THREE.BoxGeometry(0.22, 0.22, 0.22),
  new THREE.MeshBasicMaterial({ color: 0xffe066, transparent: true, opacity: 0.95 })
);
muzzleFlash.position.set(0, 0.025, -0.92);
muzzleFlash.visible = false;
gunGroup.add(muzzleFlash);

const GUN_REST = new THREE.Vector3(0.3, -0.3, -0.55);
gunGroup.position.copy(GUN_REST);
gunGroup.traverse(o => { o.frustumCulled = false; });
camera.add(gunGroup);

const throwArm = new THREE.Group();
const skinMatArm = new THREE.MeshLambertMaterial({ map: pixelTexture('#e8c19a') });
const forearm = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.12, 0.42), skinMatArm);
forearm.position.set(0, 0, -0.2); throwArm.add(forearm);
const handMesh = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.16, 0.16), skinMatArm);
handMesh.position.set(0, 0, -0.42); throwArm.add(handMesh);
const heldGrenade = new THREE.Mesh(
  new THREE.SphereGeometry(0.11, 8, 6),
  new THREE.MeshLambertMaterial({ map: pixelTexture('#3f7a3a') })
);
heldGrenade.position.set(0, 0.02, -0.5); throwArm.add(heldGrenade);
const ARM_HIDDEN = new THREE.Vector3(0.62, -0.75, -0.5);
throwArm.position.copy(ARM_HIDDEN);
throwArm.rotation.x = 0.3;
throwArm.visible = false;
throwArm.traverse(o => { o.frustumCulled = false; });
camera.add(throwArm);
scene.add(camera);

/* =========================================================
   5. 武器状态
   ========================================================= */
const weapon = {
  magSize: 30, mag: 30, reserve: 100, reserveMax: 100,
  reloading: false, reloadTime: 1.9, reloadStart: 0, reloadEnd: 0,
  fireRate: 0.11, lastShot: 0, damage: 25,
};
let grenades = 3;
const GRENADE_MAX = 6;

const hpbar    = document.getElementById('hpbar');
const hptext   = document.getElementById('hptext');
const magEl    = document.getElementById('mag');
const reserveEl= document.getElementById('reserve');
const reloadHint = document.getElementById('reload-hint');
const grenadeEl  = document.getElementById('grenade');
const killsEl    = document.getElementById('kills');
const timerEl    = document.getElementById('timer');
const hurtEl     = document.getElementById('hurt');
const flashEl    = document.getElementById('flash');
const gameoverEl = document.getElementById('gameover');

let kills = 0;
let gameOver = false;

function updateHpUI() {
  const pct = Math.max(0, player.hp) / 100;
  hpbar.style.width = (pct * 100) + '%';
  hpbar.style.background = pct > 0.6 ? '#4ddc64' : (pct > 0.3 ? '#e8c83c' : '#e64646');
  hptext.textContent = 'HP ' + Math.max(0, Math.round(player.hp)) + '%';
}
function updateAmmoUI() {
  magEl.textContent = weapon.mag;
  magEl.classList.toggle('low', weapon.mag <= 5 && !weapon.reloading);
  reserveEl.textContent = '/ ' + weapon.reserve;
}
function updateGrenadeUI() {
  grenadeEl.textContent = '手榴弹 × ' + grenades;
}

/* =========================================================
   6. 子弹系统
   ========================================================= */
const bullets = [];
const enemyBullets = [];
const bulletGeo = new THREE.BoxGeometry(0.09, 0.09, 0.09);
const bulletMat = new THREE.MeshBasicMaterial({ color: 0xfff2a0 });
const eBulletGeo = new THREE.BoxGeometry(0.14, 0.14, 0.14);
const eBulletMat = new THREE.MeshBasicMaterial({ color: 0xff7030 });
const sparkGeo = new THREE.BoxGeometry(0.16, 0.16, 0.16);

function spawnSpark(pos, color = 0xffb020, size = 1) {
  const m = new THREE.Mesh(sparkGeo, new THREE.MeshBasicMaterial({ color, transparent: true }));
  m.position.copy(pos);
  m.scale.setScalar(size);
  scene.add(m);
  const t0 = performance.now();
  (function anim() {
    const t = (performance.now() - t0) / 200;
    if (t >= 1) { scene.remove(m); m.material.dispose(); return; }
    m.scale.setScalar(size * (1 - t));
    m.material.opacity = 1 - t;
    requestAnimationFrame(anim);
  })();
}

function spawnPlayerBullet() {
  gunGroup.updateWorldMatrix(true, false);
  const start = new THREE.Vector3(0, 0.025, -1.0);
  gunGroup.localToWorld(start);
  const mesh = new THREE.Mesh(bulletGeo, bulletMat);
  mesh.position.copy(start);
  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  dir.x += (Math.random() - 0.5) * 0.012;
  dir.y += (Math.random() - 0.5) * 0.012;
  dir.normalize();
  scene.add(mesh);
  bullets.push({ mesh, dir, speed: 110, life: 1.8 });
}

function startReload() {
  if (weapon.reloading || gameOver) return;
  if (weapon.mag >= weapon.magSize) return;
  if (weapon.reserve <= 0) return;
  weapon.reloading = true;
  weapon.reloadStart = performance.now() / 1000;
  weapon.reloadEnd = weapon.reloadStart + weapon.reloadTime;
  reloadHint.textContent = '换弹中…';
}
function finishReload() {
  const need = weapon.magSize - weapon.mag;
  const take = Math.min(need, weapon.reserve);
  weapon.mag += take;
  weapon.reserve -= take;
  weapon.reloading = false;
  reloadHint.textContent = '';
  updateAmmoUI();
}

function tryShoot() {
  if (gameOver || weapon.reloading) return;
  if (throwAnim.active) return;
  const now = performance.now() / 1000;
  if (now - weapon.lastShot < weapon.fireRate) return;

  if (weapon.mag <= 0) {
    if (weapon.reserve > 0) startReload();
    return;
  }
  weapon.lastShot = now;
  weapon.mag--;
  updateAmmoUI();
  spawnPlayerBullet();
  muzzleFlash.visible = true;
  muzzleFlash.rotation.z = Math.random() * Math.PI;
  setTimeout(() => { muzzleFlash.visible = false; }, 45);
  recoil = 0.06;
  if (weapon.mag === 0 && weapon.reserve > 0) {
    setTimeout(() => { if (!weapon.reloading) startReload(); }, 180);
  }
}

function spawnEnemy() {

function setEnemyEmissive(e, hex) {

  });

function damageEnemy(e, dmg) {

function killEnemy(e) {

const grenadeProjectiles = [];

const throwAnim = { active: false, startTime: 0, duration: 0.55, spawned: false };

function spawnGrenadeProjectile() {

function throwGrenade() {
  if (gameOver) return;
  if (grenades <= 0) return;
  if (throwAnim.active) return;
  grenades--;
  updateGrenadeUI();
  throwAnim.active = true;
  throwAnim.startTime = performance.now() / 1000;
  throwAnim.spawned = false;
  throwArm.visible = true;
  heldGrenade.visible = true;
  gunGroup.visible = false;
}
function updateThrowAnimation(now) {
  if (!throwAnim.active) return;
  const t = (now - throwAnim.startTime) / throwAnim.duration;
  if (t >= 1) {
    throwAnim.active = false;
    throwArm.visible = false;
    heldGrenade.visible = true;
    gunGroup.visible = true;
    return;
  }
  let x, y, z, rotX;
  if (t < 0.4) {
    const p = t / 0.4; const e = 1 - Math.pow(1 - p, 2);
    x = THREE.MathUtils.lerp(ARM_HIDDEN.x, 0.32, e);
    y = THREE.MathUtils.lerp(ARM_HIDDEN.y, -0.35, e);
    z = THREE.MathUtils.lerp(ARM_HIDDEN.z, -0.30, e);
    rotX = THREE.MathUtils.lerp(0.3, -0.7, e);
  } else if (t < 0.55) {
    const p = (t - 0.4) / 0.15; const e = p * p;
    x = THREE.MathUtils.lerp(0.32, 0.48, e);
    y = THREE.MathUtils.lerp(-0.35, -0.55, e);
    z = THREE.MathUtils.lerp(-0.30, -0.85, e);
    rotX = THREE.MathUtils.lerp(-0.7, 0.6, e);
    if (!throwAnim.spawned && p > 0.4) {
      throwAnim.spawned = true;
      heldGrenade.visible = false;
      spawnGrenadeProjectile();
    }
  } else {
    const p = (t - 0.55) / 0.45; const e = p * p;
    x = THREE.MathUtils.lerp(0.48, ARM_HIDDEN.x, e);
    y = THREE.MathUtils.lerp(-0.55, ARM_HIDDEN.y, e);
    z = THREE.MathUtils.lerp(-0.85, ARM_HIDDEN.z, e);
    rotX = THREE.MathUtils.lerp(0.6, 0.3, e);
  }
  throwArm.position.set(x, y, z);
  throwArm.rotation.x = rotX;
}
function explode(pos) {
  const light = new THREE.PointLight(0xffbb44, 22, 30, 2);
  light.position.copy(pos); scene.add(light);
  const ballMat = new THREE.MeshBasicMaterial({ color: 0xffdd66, transparent: true, opacity: 1, depthWrite: false });
  const ball = new THREE.Mesh(new THREE.SphereGeometry(1, 12, 8), ballMat);
  ball.position.copy(pos); scene.add(ball);
  const coreMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 1, depthWrite: false });
  const core = new THREE.Mesh(new THREE.SphereGeometry(0.6, 10, 8), coreMat);
  core.position.copy(pos); scene.add(core);
  const sparks = [];
  for (let i = 0; i < 26; i++) {
    const s = new THREE.Mesh(
      new THREE.BoxGeometry(0.18, 0.18, 0.18),
      new THREE.MeshBasicMaterial({ color: [0xffd166, 0xff8a3d, 0xffef9e][i % 3], transparent: true })
    );
    s.position.copy(pos);
    const d = new THREE.Vector3(
      Math.random() - 0.5, Math.random() * 0.9 + 0.15, Math.random() - 0.5
    ).normalize().multiplyScalar(7 + Math.random() * 13);
    scene.add(s);
    sparks.push({ mesh: s, vel: d, rot: new THREE.Vector3(Math.random() * 10, Math.random() * 10, Math.random() * 10) });
  }
  const t0 = performance.now();
  const DUR = 750;
  (function anim() {
    const t = (performance.now() - t0) / DUR;
    if (t >= 1) {
      scene.remove(ball); scene.remove(core); scene.remove(light);
      ball.geometry.dispose(); core.geometry.dispose();
      ballMat.dispose(); coreMat.dispose();
      sparks.forEach(s => { scene.remove(s.mesh); s.mesh.geometry.dispose(); s.mesh.material.dispose(); });
      return;
    }
    const e = 1 - Math.pow(1 - t, 2);
    ball.scale.setScalar(1 + e * 8.5);
    ballMat.opacity = 1 - e;
    core.scale.setScalar(1 + e * 4);
    coreMat.opacity = Math.max(0, 1 - t * 2.4);
    light.intensity = 22 * (1 - t) * (1 - t);
    const step = 1 / 60;
    sparks.forEach(s => {
      s.vel.y -= 32 * step;
      s.mesh.position.addScaledVector(s.vel, step);
      s.mesh.rotation.x += s.rot.x * step;
      s.mesh.rotation.y += s.rot.y * step;
      s.mesh.material.opacity = 1 - e;
      s.mesh.scale.setScalar(Math.max(0.05, 1 - e));
    });
    requestAnimationFrame(anim);
  })();
  const RADIUS = 7.5;
  [...enemies].forEach(e => {
    if (!e.alive) return;
    const d = e.group.position.distanceTo(pos);
    if (d < RADIUS) {
      const dmg = 130 * (1 - d / RADIUS);
      damageEnemy(e, Math.max(10, dmg));
    }
  });
  const pd = player.pos.distanceTo(pos);
  if (pd < RADIUS * 0.65) damagePlayer(25);
}

/* =========================================================
   12. 触摸控制
   ========================================================= */
const touchState = { moveInputX: 0, moveInputY: 0 };

let joyPointerId = null;
let lookPointerId = null;
let shootPointerId = null;
let lookLastX = 0;
let lookLastY = 0;

const joyBase   = document.getElementById('joystick-base');
const joyKnob   = document.getElementById('joystick-knob');
const btnShoot  = document.getElementById('btn-shoot');
const btnJump   = document.getElementById('btn-jump');
const btnReload = document.getElementById('btn-reload');
const btnGrenade= document.getElementById('btn-grenade');

const TOUCH_LOOK_SENS = 0.006;

function updateJoyVisual(tx, ty) {
  const r = joyBase.getBoundingClientRect();
  if (!r.width || !r.height) return;
  const cx = r.left + r.width / 2;
  const cy = r.top + r.height / 2;
  const maxDist = r.width / 2 - 33;

  let dx = tx - cx;
  let dy = ty - cy;
  const dist = Math.hypot(dx, dy);
  if (dist > maxDist) {
    dx = dx / dist * maxDist;
    dy = dy / dist * maxDist;
  }
  joyKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  touchState.moveInputX = dx / maxDist;
  touchState.moveInputY = -dy / maxDist;
}
function resetJoy() {
  joyPointerId = null;
  touchState.moveInputX = 0;
  touchState.moveInputY = 0;
  if (joyKnob) joyKnob.style.transform = 'translate(-50%, -50%)';
}

/* 通用按钮绑定（除射击外都用它） */
function bindButton(el, { onDown, onUp, onMove, capture = true } = {}) {
  if (!el) return;
  el.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse') return;
    e.preventDefault();
    e.stopPropagation();
    if (capture) {
      try { el.setPointerCapture(e.pointerId); } catch (err) {}
    }
    el.classList.add('pressed');
    if (onDown) onDown(e);
  }, { passive: false });
  el.addEventListener('pointermove', e => {
    if (e.pointerType === 'mouse') return;
    if (!el.hasPointerCapture || !el.hasPointerCapture(e.pointerId)) return;
    e.preventDefault();
    e.stopPropagation();
    if (onMove) onMove(e);
  }, { passive: false });
  const release = e => {
    if (e.pointerType === 'mouse') return;
    e.preventDefault();
    e.stopPropagation();
    el.classList.remove('pressed');
    if (onUp) onUp(e);
  };
  el.addEventListener('pointerup', release);
  el.addEventListener('pointercancel', release);
  el.addEventListener('lostpointercapture', release);
}

if (isTouch) {
  /* ---------- 摇杆 ---------- */
  joyBase.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse') return;
    e.preventDefault();
    e.stopPropagation();
    try { joyBase.setPointerCapture(e.pointerId); } catch (err) {}
    joyPointerId = e.pointerId;
    updateJoyVisual(e.clientX, e.clientY);
  });
  joyBase.addEventListener('pointermove', e => {
    if (e.pointerType === 'mouse') return;
    if (e.pointerId !== joyPointerId) return;
    e.preventDefault();
    e.stopPropagation();
    updateJoyVisual(e.clientX, e.clientY);
  });
  const joyRelease = e => {
    if (e.pointerType === 'mouse') return;
    if (e.pointerId !== joyPointerId) return;
    e.preventDefault();
    e.stopPropagation();
    try { joyBase.releasePointerCapture(e.pointerId); } catch (err) {}
    resetJoy();
  };
  joyBase.addEventListener('pointerup', joyRelease);
  joyBase.addEventListener('pointercancel', joyRelease);

  /* ---------- 射击按钮（按住连发 + 滑动转向） ---------- */
  /* 关键：不 setPointerCapture，把这个手指同时注册为视角指针 */
  btnShoot.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse') return;
    e.preventDefault();
    e.stopPropagation();
    btnShoot.classList.add('pressed');
    shootPointerId = e.pointerId;
    mouseDown = true;

    /* 让这个手指同时参与视角控制 */
    if (lookPointerId === null) {
      lookPointerId = e.pointerId;
      lookLastX = e.clientX;
      lookLastY = e.clientY;
    }
  }, { passive: false });

  btnShoot.addEventListener('pointermove', e => {
    if (e.pointerType === 'mouse') return;
    if (e.pointerId !== shootPointerId) return;
    /* 不 preventDefault，也不 stopPropagation，让事件继续传到 window 处理视角 */
    if (lookPointerId === e.pointerId) {
      const dx = e.clientX - lookLastX;
      const dy = e.clientY - lookLastY;
      lookLastX = e.clientX;
      lookLastY = e.clientY;
      player.yaw -= dx * TOUCH_LOOK_SENS;
      player.pitch -= dy * TOUCH_LOOK_SENS;
      const lim = Math.PI / 2 - 0.02;
      player.pitch = Math.max(-lim, Math.min(lim, player.pitch));
    }
  }, { passive: false });

  const shootRelease = e => {
    if (e.pointerType === 'mouse') return;
    if (e.pointerId !== shootPointerId) return;
    e.preventDefault();
    e.stopPropagation();
    btnShoot.classList.remove('pressed');
    shootPointerId = null;
    mouseDown = false;
    if (lookPointerId === e.pointerId) lookPointerId = null;
  };
  btnShoot.addEventListener('pointerup', shootRelease);
  btnShoot.addEventListener('pointercancel', shootRelease);

  /* ---------- 跳跃按钮 ---------- */
  bindButton(btnJump, {
    capture: false,
    onDown: () => {
      if (player.onGround && !gameOver) {
        player.vel.y = 6.4;
        player.onGround = false;
      }
    }
  });

  /* ---------- 换弹按钮 ---------- */
  bindButton(btnReload, {
    capture: false,
    onDown: () => startReload()
  });

  /* ---------- 手雷按钮 ---------- */
  bindButton(btnGrenade, {
    capture: false,
    onDown: () => throwGrenade()
  });

  /* ---------- 视角控制（画面空白区域起手） ---------- */
  function isUIElement(el) {
    return !!(el && el.closest && el.closest('#mobile-controls'));
  }

  window.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse') return;
    if (isUIElement(e.target)) return;
    e.preventDefault();
    if (lookPointerId === null) {
      lookPointerId = e.pointerId;
      lookLastX = e.clientX;
      lookLastY = e.clientY;
    }
  }, { passive: false });

  window.addEventListener('pointermove', e => {
    if (e.pointerType === 'mouse') return;
    if (e.pointerId !== lookPointerId) return;
    /* 摇杆手指不参与视角；射击手指已在自己的 handler 里处理 */
    if (e.pointerId === joyPointerId) return;
    if (e.pointerId === shootPointerId) return; // 射击手指的转向在按钮上处理
    e.preventDefault();
    const dx = e.clientX - lookLastX;
    const dy = e.clientY - lookLastY;
    lookLastX = e.clientX;
    lookLastY = e.clientY;
    player.yaw -= dx * TOUCH_LOOK_SENS;
    player.pitch -= dy * TOUCH_LOOK_SENS;
    const lim = Math.PI / 2 - 0.02;
    player.pitch = Math.max(-lim, Math.min(lim, player.pitch));
  }, { passive: false });

  function lookRelease(e) {
    if (e.pointerType === 'mouse') return;
    if (e.pointerId === lookPointerId) lookPointerId = null;
  }
  window.addEventListener('pointerup', lookRelease, { passive: false });
  window.addEventListener('pointercancel', lookRelease, { passive: false });

  /* ---------- 游戏结束点击屏幕重开 ---------- */
  gameoverEl.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse') return;
    e.preventDefault();
    if (gameOver) resetGame();
  }, { passive: false });
}

/* =========================================================
   13. 更新逻辑
   ========================================================= */
let recoil = 0;
const PLAYER_R = 0.42;

function collideMove(delta) {
  ['x', 'z'].forEach(ax => {
    const before = player.pos[ax];
    player.pos[ax] += delta[ax];
    const pBox = new THREE.Box3(
      new THREE.Vector3(player.pos.x - PLAYER_R, player.pos.y - player.height + 0.15, player.pos.z - PLAYER_R),
      new THREE.Vector3(player.pos.x + PLAYER_R, player.pos.y + 0.15, player.pos.z + PLAYER_R)
    );
    for (const s of solids) {
      if (pBox.intersectsBox(s)) { player.pos[ax] = before; break; }
    }
  });
}

function updatePlayer(dt, now) {
  const speed = 8.2;
  const forward = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
  const right   = new THREE.Vector3( Math.cos(player.yaw), 0, -Math.sin(player.yaw));

  const move = new THREE.Vector3();
  if (keys['KeyW'] || keys['ArrowUp'])    move.add(forward);
  if (keys['KeyS'] || keys['ArrowDown'])  move.sub(forward);
  if (keys['KeyD'] || keys['ArrowRight']) move.add(right);
  if (keys['KeyA'] || keys['ArrowLeft'])  move.sub(right);

  if (Math.abs(touchState.moveInputX) > 0.05 || Math.abs(touchState.moveInputY) > 0.05) {
    move.addScaledVector(right,   touchState.moveInputX);
    move.addScaledVector(forward, touchState.moveInputY);
  }

  const isMoving = move.lengthSq() > 0;
  if (isMoving) move.normalize().multiplyScalar(speed * dt);

  collideMove(move);

  if (keys['Space'] && player.onGround) {
    player.vel.y = 6.4;
    player.onGround = false;
  }
  player.vel.y -= 19 * dt;
  player.pos.y += player.vel.y * dt;

  if (player.pos.y <= player.height) {
    player.pos.y = player.height;
    player.vel.y = 0;
    player.onGround = true;
  }

  player.pos.x = Math.max(-62, Math.min(62, player.pos.x));
  player.pos.z = Math.max(-62, Math.min(62, player.pos.z));

  camera.position.copy(player.pos);
  camera.rotation.set(0, 0, 0);
  camera.rotateY(player.yaw);
  camera.rotateX(player.pitch);

  recoil *= Math.pow(0.0008, dt);
  let gunY = GUN_REST.y + recoil * 0.55;
  let gunZ = GUN_REST.z + recoil;
  let gunRotX = 0;
  if (weapon.reloading) {
    const p = Math.min(1, (now - weapon.reloadStart) / weapon.reloadTime);
    const dip = Math.sin(p * Math.PI);
    gunY -= dip * 0.3;
    gunRotX = dip * 0.85;
  }
  if (isMoving && player.onGround) {
    gunY += Math.sin(now * 11) * 0.014;
    gunZ += Math.cos(now * 11) * 0.008;
  }
  gunGroup.position.set(GUN_REST.x, gunY, gunZ);
  gunGroup.rotation.x = gunRotX;

  if (weapon.reloading && now >= weapon.reloadEnd) finishReload();
}

const _tmpV = new THREE.Vector3();

function updatePlayerBullets(dt) {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.life -= dt;
    const next = _tmpV.copy(b.mesh.position).addScaledVector(b.dir, b.speed * dt);

    let hitEnemy = null;
    for (const e of enemies) {
      if (!e.alive) continue;
      const dx = next.x - e.group.position.x;
      const dz = next.z - e.group.position.z;
      const dy = next.y - e.group.position.y;
      if (dx * dx + dz * dz < 0.45 * 0.45 && dy > -0.1 && dy < 1.95) { hitEnemy = e; break; }
    }
    if (hitEnemy) {
      damageEnemy(hitEnemy, weapon.damage);
      spawnSpark(next.clone(), 0xff4040, 1.2);
      scene.remove(b.mesh);
      bullets.splice(i, 1);
      continue;
    }
    const probe = new THREE.Box3(
      new THREE.Vector3(next.x - 0.05, next.y - 0.05, next.z - 0.05),
      new THREE.Vector3(next.x + 0.05, next.y + 0.05, next.z + 0.05)
    );
    let hitWorld = next.y <= 0.02;
    if (!hitWorld) {
      for (const s of solids) {
        if (probe.intersectsBox(s)) { hitWorld = true; break; }
      }
    }
    if (hitWorld) {
      spawnSpark(next.clone(), 0xffcc66, 0.9);
      scene.remove(b.mesh);
      bullets.splice(i, 1);
      continue;
    }
    b.mesh.position.copy(next);
    if (b.life <= 0) { scene.remove(b.mesh); bullets.splice(i, 1); }
  }
}

function updateEnemyBullets(dt) {
  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const b = enemyBullets[i];
    b.life -= dt;
    const next = _tmpV.copy(b.mesh.position).addScaledVector(b.dir, b.speed * dt);
    const dx = next.x - player.pos.x;
    const dz = next.z - player.pos.z;
    const dy = next.y - player.pos.y;
    if (dx * dx + dz * dz < 0.5 * 0.5 && dy > -1.75 && dy < 0.4) {
      damagePlayer(25);
      spawnSpark(next.clone(), 0xff3030, 1.3);
      flashEl.style.transition = 'none';
      flashEl.style.opacity = '0.22';
      requestAnimationFrame(() => {
        flashEl.style.transition = 'opacity .22s';
        flashEl.style.opacity = '0';
      });
      scene.remove(b.mesh);
      enemyBullets.splice(i, 1);
      continue;
    }
    const probe = new THREE.Box3(
      new THREE.Vector3(next.x - 0.06, next.y - 0.06, next.z - 0.06),
      new THREE.Vector3(next.x + 0.06, next.y + 0.06, next.z + 0.06)
    );
    let hitWorld = next.y <= 0.02;
    if (!hitWorld) {
      for (const s of solids) {
        if (probe.intersectsBox(s)) { hitWorld = true; break; }
      }
    }
    if (hitWorld) {
      spawnSpark(next.clone(), 0xff9040, 0.85);
      scene.remove(b.mesh);
      enemyBullets.splice(i, 1);
      continue;
    }
    b.mesh.position.copy(next);
    if (b.life <= 0) { scene.remove(b.mesh); enemyBullets.splice(i, 1); }
  }
}

function updateEnemies(dt, now) {
  for (const e of enemies) {
    if (!e.alive) continue;
    if (e.flashTimer > 0) {
      e.flashTimer -= dt;
      if (e.flashTimer <= 0) setEnemyEmissive(e, 0x000000);
    }
    const dx = player.pos.x - e.group.position.x;
    const dz = player.pos.z - e.group.position.z;
    const dist = Math.hypot(dx, dz);
    if (dist > 0.01) e.group.rotation.y = Math.atan2(dx, dz);
    if (dist > e.attackRange) {
      const nx = dx / dist, nz = dz / dist;
      e.group.position.x += nx * e.speed * dt;
      e.group.position.z += nz * e.speed * dt;
      e.walkPhase += dt * 10;
      e.group.position.y = Math.abs(Math.sin(e.walkPhase)) * 0.07;
    } else {
      e.group.position.y = 0;
    }
    if (dist < 55 && now >= e.nextShot) {
      e.nextShot = now + e.shootInterval;
      enemyShoot(e);
    }
  }
}

function updateGrenades(dt, now) {
  for (let i = grenadeProjectiles.length - 1; i >= 0; i--) {
    const g = grenadeProjectiles[i];
    g.vel.y -= 24 * dt;
    g.mesh.position.addScaledVector(g.vel, dt);
    if (g.mesh.position.y < 0.14) {
      g.mesh.position.y = 0.14;
      g.vel.y = Math.abs(g.vel.y) * 0.42;
      g.vel.x *= 0.7; g.vel.z *= 0.7;
      if (Math.abs(g.vel.y) < 0.6) g.vel.y = 0;
    }
    g.mesh.rotation.x += g.spin.x * dt;
    g.mesh.rotation.y += g.spin.y * dt;
    g.mesh.rotation.z += g.spin.z * dt;
    g.timer -= dt;
    if (g.timer < 0.7) {
      const on = Math.floor(now * 14) % 2 === 0;
      g.mesh.scale.setScalar(on ? 1.35 : 1.0);
    }
    if (g.timer <= 0) {
      explode(g.mesh.position.clone());
      scene.remove(g.mesh);
      grenadeProjectiles.splice(i, 1);
    }
  }
}

function updatePickups(dt, now) {
  for (let i = pickups.length - 1; i >= 0; i--) {
    const p = pickups[i];
    p.life -= dt;
    p.mesh.position.y = p.baseY + Math.sin(now * 2.2 + p.phase) * 0.12;
    p.mesh.rotation.y += dt * 1.6;
    const d = Math.hypot(p.mesh.position.x - player.pos.x, p.mesh.position.z - player.pos.z);
    if (d < 1.6) {
      let taken = false;
      if (p.type === 'ammo') {
        if (weapon.reserve < weapon.reserveMax) {
          weapon.reserve = Math.min(weapon.reserveMax, weapon.reserve + 50);
          updateAmmoUI(); taken = true;
        }
      } else {
        if (grenades < GRENADE_MAX) { grenades++; updateGrenadeUI(); taken = true; }
      }
      if (taken) {
        spawnSpark(p.mesh.position.clone(), p.type === 'ammo' ? 0xffd25a : 0x6cf07a, 1.1);
        scene.remove(p.mesh);
        if (p.beam) scene.remove(p.beam);
        pickups.splice(i, 1);
        continue;
      }
    }
    if (p.life <= 0) {
      scene.remove(p.mesh);
      if (p.beam) scene.remove(p.beam);
      pickups.splice(i, 1);
    }
  }
}

function updatePickupSpawn(dt) {
  pickupTimer += dt;
  const remain = Math.max(0, PICKUP_INTERVAL - pickupTimer);
  timerEl.textContent = '下一波补给: ' + Math.ceil(remain) + 's';
  if (pickupTimer >= PICKUP_INTERVAL) {
    pickupTimer = 0;
    spawnRandomPickup();
  }
}

/* =========================================================
   14. 主循环
   ========================================================= */
let last = performance.now();

function loop() {
  requestAnimationFrame(loop);
  const nowMs = performance.now();
  let dt = (nowMs - last) / 1000;
  last = nowMs;
  dt = Math.min(dt, 0.05);
  const now = nowMs / 1000;

  if (!gameOver) {
    updatePlayer(dt, now);
    updateEnemies(dt, now);
    updateGrenades(dt, now);
    updatePickups(dt, now);
    updatePickupSpawn(dt);
    updateThrowAnimation(now);
    if (mouseDown) tryShoot();
  }
  updatePlayerBullets(dt);
  updateEnemyBullets(dt);
  renderer.render(scene, camera);
}

/* =========================================================
   15. 初始化
   ========================================================= */
updateHpUI();
updateAmmoUI();
updateGrenadeUI();

if (isTouch) {
  document.getElementById('gameover-tip').textContent = '点击屏幕重新开始';
}

for (let i = 0; i < MAX_ENEMIES; i++) spawnEnemy();
spawnPickup('ammo');
spawnPickup('grenade');

loop();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
